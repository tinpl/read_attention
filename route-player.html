<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Route player · mind trainer</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #15181c;
    --panel-2: #191d22;
    --panel-3: #1e232a;
    --border: #272c34;
    --border-strong: #343b45;
    --text: #d9dde3;
    --muted: #8c939e;
    --dim: #5f6671;
    --accent: #d19a66;
    --accent-soft: rgba(209, 154, 102, 0.12);
    --accent-border: rgba(209, 154, 102, 0.5);
    --danger: #c47a72;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
  kbd {
    font: 10px/1 "Segoe UI", system-ui, sans-serif;
    color: var(--dim);
    border: 1px solid var(--border);
    border-bottom-color: var(--border-strong);
    border-radius: 4px;
    padding: 2px 4px;
    background: var(--bg);
  }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) 292px 28px; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    color: var(--accent);
    background: var(--panel-2);
    flex: 0 0 26px;
  }
  .product { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  .title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
  }
  .control select {
    height: 26px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    border-radius: 5px;
    padding: 0 6px;
    font-size: 10.5px;
  }
  .tool, .primary, .ghost {
    height: 27px;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: 10.5px;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: 0.12s ease;
  }
  .tool:hover, .ghost:hover { color: var(--text); border-color: var(--border-strong); background: var(--panel-3); }
  .primary {
    color: #f3dfc9;
    border-color: var(--accent-border);
    background: var(--accent-soft);
  }
  .primary:hover { background: rgba(209, 154, 102, 0.2); }
  .primary.active { color: #f3dfc9; border-color: var(--accent); background: rgba(209, 154, 102, 0.22); }
  .lang { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .lang button {
    min-width: 28px; height: 24px;
    border: 0; border-radius: 4px;
    background: transparent; color: var(--dim);
    font-size: 10px; letter-spacing: 0.04em;
  }
  .lang button:hover { color: var(--text); }
  .lang button.active { color: #f3dfc9; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-border); }

  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 460px; min-height: 0; }
  .text-pane { min-width: 0; min-height: 0; overflow: auto; padding: 34px 48px 60px; background: var(--bg); }
  .text-pane::-webkit-scrollbar { width: 8px; }
  .text-pane::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 4px; }
  .text-head { max-width: 760px; margin: 0 auto 18px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .eyebrow { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .hint { font-size: 10px; color: var(--dim); }
  #text {
    max-width: 760px;
    margin: 0 auto;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    line-height: 1.75;
    color: #d9dde3;
  }
  #text p { margin: 0 0 1.05em; }
  .text-foot {
    max-width: 760px;
    margin: 28px auto 0;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--dim);
    font-size: 10px;
  }

  .route-pane {
    position: relative;
    min-height: 0;
    border-left: 1px solid var(--border);
    background:
      radial-gradient(circle at 50% 42%, rgba(209, 154, 102, 0.06), transparent 62%),
      #111318;
    overflow: hidden;
  }
  #route-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .route-path {
    fill: none;
    stroke: #2e3540;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    transition: stroke 0.15s ease, opacity 0.15s ease;
  }
  .route-path.active { stroke: var(--accent); stroke-width: 3; }
  .route-path.inactive { opacity: 0.38; }
  .route-node {
    fill: #191d22;
    stroke: #3a414b;
    stroke-width: 1.5;
    transition: 0.15s ease;
  }
  .route-node.active { fill: rgba(209, 154, 102, 0.22); stroke: var(--accent); }
  #playhead-halo { fill: rgba(243, 223, 201, 0.12); }
  #playhead { fill: #f3dfc9; }
  .route-empty {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    text-align: center;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  .route-hud {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    pointer-events: none;
  }

  .log-pane {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 9px 14px 12px;
    display: grid;
    grid-template-rows: auto auto auto auto minmax(0, 1fr);
    gap: 6px;
    min-height: 0;
  }
  .log-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .summary { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip {
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 500; }
  .rating-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rating-label { width: 74px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .rating { display: inline-flex; gap: 2px; }
  .rating button {
    width: 24px; height: 22px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--dim);
    border-radius: 4px;
    font-size: 10px;
  }
  .rating button.active { color: #f3dfc9; border-color: var(--accent-border); background: var(--accent-soft); }
  .note-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #note {
    flex: 1;
    min-width: 180px;
    height: 28px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 5px;
    padding: 0 9px;
    color: var(--text);
  }
  #note::placeholder { color: var(--dim); }
  .log { overflow: auto; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 4px; }
  .log-empty { color: var(--dim); font-size: 10.5px; padding: 4px 2px; }
  .log-entry { border: 1px solid var(--border); background: var(--panel-2); border-radius: 5px; padding: 6px 8px; }
  .log-top { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: var(--dim); flex-wrap: wrap; }
  .log-route { color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
  .log-ratings { margin-left: auto; color: var(--muted); }
  .log-note { margin-top: 3px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .log-note.empty { color: var(--dim); font-style: italic; }
  .log-remove { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
  .log-remove:hover { color: var(--danger); }

  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 14px;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
    overflow-x: auto;
  }
  .keys { display: flex; align-items: center; gap: 14px; }
  .keys > span { display: inline-flex; align-items: center; gap: 5px; }
  .statusbar kbd { color: var(--text); border-color: var(--border-strong); }
  .status-mode { margin-left: auto; color: var(--dim); }
  .timer { display: flex; align-items: center; gap: 4px; }
  .timer-btn {
    height: 20px;
    padding: 0 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 4px;
    color: var(--muted);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .timer-btn.running { color: #f3dfc9; border-color: var(--accent-border); background: var(--accent-soft); }
  .timer-reset { border: 0; background: transparent; color: var(--dim); font-size: 12px; padding: 0 2px; }
  .timer-reset:hover { color: var(--text); }

  @media (max-width: 980px) {
    .app { grid-template-rows: auto minmax(0, 1fr) 320px 28px; }
    .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 320px; }
    .route-pane { border-left: 0; border-top: 1px solid var(--border); }
    .text-pane { padding: 24px 22px 40px; }
    #text { font-size: 18px; }
    .title { max-width: 170px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2.5 8 C2.5 4.5 5 3 8 3 C11 3 13.5 4.5 13.5 8 C13.5 11.5 11 13 8 13 C5 13 2.5 11.5 2.5 8 Z" stroke="currentColor"/>
          <circle cx="8" cy="3" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="product" data-i18n="product">Route player</div>
        <div class="title" id="text-title">The Index</div>
      </div>
    </div>

    <div class="controls">
      <label class="control"><span data-i18n="route">Route</span>
        <select id="route">
          <option value="none">No route</option>
          <option value="line">Line</option>
          <option value="loop" selected>Loop</option>
          <option value="branch">Branch</option>
          <option value="zigzag">Zigzag</option>
        </select>
      </label>
      <label class="control"><span data-i18n="speed">Speed</span>
        <select id="speed">
          <option value="slow">Slow</option>
          <option value="medium" selected>Medium</option>
          <option value="fast">Fast</option>
        </select>
      </label>
      <button id="play" class="primary">Play <kbd>Space</kbd></button>
      <button id="reset-route" class="tool" title="Reset route (R)" data-i18n="reset">Reset</button>
      <button id="next-text" class="tool" data-i18n="nextText">Text →</button>
      <button id="export" class="tool" data-i18n="export">Export</button>
      <a class="tool" href="live-probe.html">Screening</a>
      <div class="lang" role="group" aria-label="Language" data-i18n-aria="langLabel">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="text-pane">
      <div class="text-head">
        <span class="eyebrow" data-i18n="textEyebrow">Text for the route</span>
        <span class="hint" data-i18n="textHint">Play the route, follow it for one cycle, then read.</span>
      </div>
      <article id="text"></article>
      <div class="text-foot">
        <span id="word-count">—</span>
        <span data-i18n="textFoot">The route stays visible while you read</span>
      </div>
    </section>

    <section class="route-pane">
      <svg id="route-svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g id="route-paths"></g>
        <g id="route-nodes"></g>
        <g id="playhead-group">
          <circle id="playhead-halo" r="16"></circle>
          <circle id="playhead" r="5.5"></circle>
        </g>
      </svg>
      <div class="route-empty" id="route-empty" data-i18n="noRoute">No route</div>
      <div class="route-hud">
        <span id="route-label">Loop</span>
        <span id="route-state">paused</span>
      </div>
    </section>
  </main>

  <footer class="log-pane">
    <div class="log-head">
      <span class="eyebrow" data-i18n="notes">Observations</span>
      <div class="summary" id="summary"></div>
      <button id="clear-log" class="tool" data-i18n="clear">Clear</button>
    </div>

    <div class="rating-line">
      <span class="rating-label" data-i18n="follow">Follow</span>
      <div class="rating" data-rating="follow">
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
      </div>
    </div>
    <div class="rating-line">
      <span class="rating-label" data-i18n="flow">Flow</span>
      <div class="rating" data-rating="flow">
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
      </div>
    </div>
    <div class="rating-line">
      <span class="rating-label" data-i18n="clarity">Clarity</span>
      <div class="rating" data-rating="clarity">
        <button type="button" data-value="1">1</button>
        <button type="button" data-value="2">2</button>
        <button type="button" data-value="3">3</button>
        <button type="button" data-value="4">4</button>
        <button type="button" data-value="5">5</button>
      </div>
    </div>

    <div class="note-row">
      <input id="note" placeholder="What changed in the reading?" data-i18n-placeholder="notePlaceholder">
      <button id="save-note" class="primary" data-i18n="save">Save</button>
    </div>
    <div class="log" id="log"></div>
  </footer>

  <footer class="statusbar">
    <div class="keys">
      <span><kbd>Space</kbd> <span data-i18n="keyPlay">play</span></span>
      <span><kbd>S</kbd> <span data-i18n="keyTimer">timer</span></span>
      <span><kbd>R</kbd> <span data-i18n="keyReset">reset</span></span>
      <span><kbd>T</kbd> <span data-i18n="keyText">text</span></span>
      <span><kbd>E</kbd> <span data-i18n="keyExport">export</span></span>
    </div>
    <span class="status-mode" id="status-mode">Loop · paused</span>
    <div class="timer">
      <button id="timer" class="timer-btn" type="button" title="Start/stop (S)" data-i18n-title="timerStartStop">⏱ 00:00.0</button>
      <button id="timer-reset" class="timer-reset" type="button" title="Reset (R)" data-i18n-title="timerReset">↺</button>
    </div>
  </footer>
</div>

<script src="route-player.js"></script>
</body>
</html>
